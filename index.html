<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC">
<title>Vistoria de entrega</title>

    --paper:#F5F2EC; --paper-alt:#EBE6DB; --surface:#FFFFFF;
    --ink:#23282B; --ink-soft:#63696C; --line:#D8D2C4;
    --blue:#2D5B7C; --blue-soft:#E4ECF1;
    --orange:#D9530B; --orange-soft:#FBE6D8;
    --amber:#B07E22; --amber-soft:#F4EAD4;
    --green:#48725A; --green-soft:#E3ECE6;
    --radius:3px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#181B1D; --paper-alt:#22262A; --surface:#202427;
      --ink:#ECE9E2; --ink-soft:#A3A8AB; --line:#3A3F43;
      --blue:#7FB0D1; --blue-soft:#20303B;
      --orange:#F08A4B; --orange-soft:#3A2618;
      --amber:#D9A94A; --amber-soft:#382E17;
      --green:#7FB897; --green-soft:#1E2E25;
    }
  }
  :root[data-theme="dark"]{
    --paper:#181B1D; --paper-alt:#22262A; --surface:#202427;
    --ink:#ECE9E2; --ink-soft:#A3A8AB; --line:#3A3F43;
    --blue:#7FB0D1; --blue-soft:#20303B;
    --orange:#F08A4B; --orange-soft:#3A2618;
    --amber:#D9A94A; --amber-soft:#382E17;
    --green:#7FB897; --green-soft:#1E2E25;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; }
  .app{ max-width:860px; margin:0 auto; padding:20px 16px 90px; }
  img{ max-width:100%; }
  button{ font-family:inherit; }
  .btn{ background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius); padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn.blue{ background:var(--blue); color:var(--paper); }
  .btn.small{ padding:6px 12px; font-size:13px; }
  .link{ background:none; border:none; padding:0; color:var(--blue); cursor:pointer; text-decoration:underline; font-size:13px; }
  .link.danger{ color:var(--orange); }
  input, select, textarea{

  textarea{ min-height:84px; resize:vertical; }
  label.lbl{ display:block; font-size:12.5px; color:var(--ink-soft); margin:12px 0 5px; }

  .userbar{ display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; flex-wrap:wrap; }
  .userbar span{ display:inline-flex; align-items:center; gap:6px; }
  .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }

  .sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }
  .back{ margin-bottom:10px; }

  .chip.orange{ background:var(--orange-soft); color:var(--orange); }
  .chip.amber{ background:var(--amber-soft); color:var(--amber); }

  .card.pedido:hover{ background:var(--surface); }

  .card .acoes{ display:flex; gap:6px; flex-shrink:0; }

  .pin.p-Baixa{ background:var(--blue); }

  .sheet .btns{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; align-items:center; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:var(--radius); z-index:60; font-size:13.5px; max-width:90vw; text-align:center; }

  .report .meta{ color:var(--ink-soft); margin:4px 0 14px; }
  .report .planbox{ position:relative; border:1px solid var(--line); margin-bottom:16px; }
  .report .planbox img{ display:block; width:100%; height:auto; }
  .rdef{ display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); page-break-inside:avoid; break-inside:avoid; }
  .rdef img{ width:150px; height:112px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; }
  .sign{ display:flex; gap:40px; margin-top:54px; }
  .sign div{ flex:1; border-top:1px solid var(--ink); padding-top:6px; font-size:12.5px; color:var(--ink-soft); text-align:center; }

  .fitem{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:var(--radius); padding:11px 12px; margin-bottom:8px; }
  .fitem.s-aprovado, .fitem.s-refeito{ border-left-color:var(--green); }
  .fitem.s-reprovado{ border-left-color:var(--orange); }
  .fitem.s-NA{ border-left-color:var(--ink-soft); }
  .fitem .ftxt{ display:flex; gap:10px; }
  .fitem .fn{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); min-width:22px; }
  .fbtns{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .fb{ flex:1; min-width:64px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:7px 6px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .fb:disabled{ opacity:.4; cursor:default; }
  .fb.on{ color:#fff; }
  .fb.on.aprovado, .fb.on.refeito{ background:var(--green); border-color:var(--green); }
  .fb.on.reprovado{ background:var(--orange); border-color:var(--orange); }
  .fb.on.NA{ background:var(--ink-soft); border-color:var(--ink-soft); }
  .fdet{ margin-top:8px; font-size:13px; color:var(--ink-soft); white-space:pre-wrap; cursor:pointer; }
  .fdet strong{ color:var(--ink); font-weight:600; }
  .fdet .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .fdet img.th{ width:64px; height:64px; object-fit:cover; border-radius:var(--radius); border:1px solid var(--line); }
  .meta-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:4px 16px; font-size:13px; margin:8px 0 14px; }
  .meta-grid b{ display:block; font-size:11.5px; font-weight:500; color:var(--ink-soft); }
  .rtab{ width:100%; border-collapse:collapse; margin:8px 0 16px; font-size:13px; }
  .rtab th, .rtab td{ border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top; }
  .rtab th{ background:var(--paper-alt); font-weight:600; }
  .rtab .res{ white-space:nowrap; font-weight:600; }
  .rtab tr{ page-break-inside:avoid; break-inside:avoid; }
  @media (max-width:560px){
    .rdef{ flex-direction:column; }
    .rdef img{ width:100%; height:auto; max-height:220px; }
  }
  @media print{
    body{ background:#fff; color:#000; }
    .no-print, .actions, .toast, .busy, .userbar{ display:none !important; }
    .app{ padding:0; max-width:none; }
    :root{ padding:0; }
    .sign div{ border-top-color:#000; color:#333; }
  }
</style>
</head>

  async function makePlantaAnotada(v, d){
    var img = await loadImage(v._plantaUrl);
    var W = Math.min(img.naturalWidth, 1600), H = Math.round(img.naturalHeight * (W / img.naturalWidth));
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, W, H);
    var r = Math.max(10, W * 0.011);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    (v.defeitos || []).forEach(function(p){
      if(p.id === d.id) return;
      var x = p.x * W, y = p.y * H;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = 'rgba(90,96,100,.55)'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(r * 1.05) + 'px sans-serif'; ctx.fillText(String(p.n), x, y);
    });
    var x0 = d.x * W, y0 = d.y * H, R = r * 1.9;
    ctx.beginPath(); ctx.arc(x0, y0, R * 1.5, 0, Math.PI*2); ctx.strokeStyle = 'rgba(217,83,11,.55)'; ctx.lineWidth = Math.max(3, r*0.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(x0, y0, R, 0, Math.PI*2); ctx.fillStyle = '#D9530B'; ctx.fill();
    ctx.lineWidth = Math.max(2, r*0.25); ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(R * 1.1) + 'px sans-serif'; ctx.fillText(String(d.n), x0, y0);
    return canvasToJpeg(cv, 600 * 1024);
  }

  async function cu(path, opts){
    opts = opts || {};

    if(opts.json){ headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.json); }
    else if(opts.form){ body = opts.form; }
    var res;
    try{ res = await fetch(API_BASE + '/api/' + path, { method: opts.method || 'GET', headers: headers, body: body }); }
    catch(e){ throw { code:'network', message:'Sem conexão com o servidor do ClickUp.' }; }
    var text = await res.text(), data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(e){}
    if(res.status === 401) throw { code:'auth', status:401, message:'Sua sessão do ClickUp expirou. Conecte de novo.' };
    if(!res.ok) throw { code:'http', status:res.status, message:(data && (data.err || data.error)) ? String(data.err || data.error) : ('O ClickUp respondeu com erro ' + res.status + '.') };
    return data;
  }

  async function sendAll(){
    var v = cur(); if(!v) return;
    var list = (v.defeitos || []).filter(function(d){ return !isComplete(d); });
    if(!list.length){ toast('Nada pendente para enviar.'); return; }
    var okCount = 0, failCount = 0, stop = false, warn = '';
    for(var i = 0; i < list.length && !stop; i++){
      var d = list[i];
      busy('Enviando ponto ' + d.n + ' (' + (i+1) + ' de ' + list.length + ')...');
      d.erro = null;
      try{
        if(!d.task_id){
          var prioTxt = d.prioridade || 'Média';
          var desc = '**Vistoria de entrega**\n' +
            '**Local:** ' + v.titulo + '\n' +
            '**Ambiente:** ' + (d.ambiente || 'Não informado') + '\n' +
            '**Ponto:** ' + d.n + ' na planta (planta marcada anexada)\n' +
            '**Prioridade:** ' + prioTxt + '\n\n' +
            '**Descrição:**\n' + d.descricao;
          var res = await cu('list/' + v.list_id + '/task', { method:'POST', json:{
            name: 'Ponto ' + d.n + ' - ' + (d.ambiente || 'Sem ambiente') + ': ' + shorten(d.descricao, 70),
            markdown_description: desc,
            priority: PRIO_NUM[prioTxt] || 3
          }});
          if(!res || !res.id) throw { code:'http', message:'O ClickUp não devolveu o ID da task.' };
          d.task_id = res.id; d.task_url = res.url || ('https://app.clickup.com/t/' + res.id);
          await updateDefeito(d.id, { task_id:d.task_id, task_url:d.task_url });
        }
      }catch(e){
        failCount++; d.erro = e.message || 'Falha ao criar a task.';
        if(ambiguous(e)) warn = 'Uma task pode ter sido criada mesmo com o erro. Confira no ClickUp antes de tentar de novo.';
        if(e.code === 'auth'){ busy(null); try{ await updateDefeito(d.id, { erro:d.erro }); }catch(x){} clickUpLogout(e.message); return; }
        if(stopErr(e)) stop = true;
        try{ await updateDefeito(d.id, { erro:d.erro }); }catch(x){}
        continue;
      }
      try{
        if(d.foto_path && !d.foto_ok){
          var fr = await fetch(d._fotoUrl); var fb = await fr.blob();
          var fd1 = new FormData(); fd1.append('attachment', fb, 'ponto-' + d.n + '-foto.jpg');
          await cu('task/' + d.task_id + '/attachment', { method:'POST', form: fd1 });
          d.foto_ok = true; await updateDefeito(d.id, { foto_ok:true });
        }
        if(!d.planta_ok){
          var pb = await makePlantaAnotada(v, d);
          var fd2 = new FormData(); fd2.append('attachment', pb, 'ponto-' + d.n + '-planta.jpg');
          await cu('task/' + d.task_id + '/attachment', { method:'POST', form: fd2 });
          d.planta_ok = true; await updateDefeito(d.id, { planta_ok:true });
        }
        okCount++;
      }catch(e){
        failCount++; d.erro = 'Task criada, mas o anexo falhou: ' + (e.message || 'erro');
        if(ambiguous(e)) warn = 'Um anexo pode ter subido mesmo com o erro. Confira a task antes de reenviar.';
        if(e.code === 'auth'){ busy(null); try{ await updateDefeito(d.id, { erro:d.erro }); }catch(x){} clickUpLogout(e.message); return; }
        if(stopErr(e)) stop = true;
        try{ await updateDefeito(d.id, { erro:d.erro }); }catch(x){}
      }
    }
    v.status = computeStatus(v.defeitos);
    try{ await updateVistoria(v.id, { status: v.status }); }catch(e){}
    busy(null);
    if(failCount === 0) toast(okCount + (okCount === 1 ? ' ponto enviado ao ClickUp.' : ' pontos enviados ao ClickUp.'));
    else toast(okCount + ' enviados, ' + failCount + ' com problema. ' + warn, true);
    render();
  }

  async function fetchAll(table, orders){
    var out = [], from = 0, size = 1000;
    for(;;){
      var q = supabase.from(table).select('*');
      orders.forEach(function(o){ q = q.order(o[0], { ascending:o[1] }); });
      var r = await q.range(from, from + size - 1);
      if(r.error) throw r.error;
      out = out.concat(r.data || []);
      if(!r.data || r.data.length < size) break;
      from += size;
    }
    return out;
  }
  async function loadFvs(){
    state.fvs.error = null;
    try{
      var modelos = await fetchAll('fvs_modelos', [['codigo', true]]);
      var insp = await fetchAll('fvs_inspecoes', [['created_at', false], ['id', true]]);
      var itens = await fetchAll('fvs_itens', [['inspecao_id', true], ['n', true]]);
      var by = {}, paths = {};
      itens.forEach(function(i){ (by[i.inspecao_id] = by[i.inspecao_id] || []).push(i); if(i.foto_path) paths[i.foto_path] = 1; });
      var list = Object.keys(paths);
      var urls = await Promise.all(list.map(resolveUrl));
      var map = {}; list.forEach(function(pt, k){ map[pt] = urls[k]; });
      itens.forEach(function(i){ i._fotoUrl = i.foto_path ? map[i.foto_path] : ''; });
      insp.forEach(function(f){ f.itens = by[f.id] || []; });
      modelos.sort(cmpCodigo);
      state.fvs.modelos = modelos; state.fvs.inspecoes = insp;
    }catch(e){
      state.fvs.error = 'Não consegui carregar as FVS: ' + sbErrorText(e) + ' (o SQL supabase/fvs.sql já foi rodado no Supabase?)';
    }
    state.fvs.ready = true;

  async function createFvs(){

    var modelo = state.fvs.modelos.filter(function(x){ return x.id === m.modeloId; })[0];
    var folder = (state.folders || []).filter(function(f){ return f.id === n.folderId; })[0];
    var list = folder && folder.lists.filter(function(l){ return l.id === n.listId; })[0];
    if(!modelo){ toast('Escolha a FVS.', true); return; }
    if(!(modelo.itens || []).length){ toast('Essa FVS não tem itens de verificação.', true); return; }
    if(!folder || !list){ toast('Escolha o prédio e a unidade.', true); return; }
    if(!m.local.trim()){ toast('Informe o local verificado.', true); return; }
    if(!m.inspetor.trim()){ toast('Informe quem está inspecionando.', true); return; }
    if(!m.data){ toast('Informe a data da inspeção.', true); return; }
    var row = null;
    try{
      busy('Criando a FVS...');
      var r = await supabase.from('fvs_inspecoes').insert({
        modelo_id: modelo.id, modelo_codigo: modelo.codigo, modelo_nome: modelo.nome,
        predio: folder.name, unidade: list.name, list_id: list.id, local: m.local.trim(), inspetor: m.inspetor.trim(),
        data_inspecao: m.data, status:'aberta', created_by: state.session.user.email
      }).select().single();
      if(r.error) throw new Error(sbErrorText(r.error));
      row = r.data;
      var ins = await supabase.from('fvs_itens').insert(modelo.itens.map(function(t, i){ return { inspecao_id: row.id, n: i + 1, texto: t }; })).select();
      if(ins.error) throw new Error(sbErrorText(ins.error));
      row.itens = (ins.data || []).sort(function(a, b){ return a.n - b.n; });
      state.fvs.inspecoes.unshift(row);
      state.fcurId = row.id; state.view = 'fvs-insp'; state.confirmDelF = false;
      state.novo = { folderId:'', listId:'', file:null };

    }catch(e){
      if(row){ try{ await supabase.from('fvs_inspecoes').delete().eq('id', row.id); }catch(x){} }
      busy(null); toast('Não consegui criar a FVS: ' + shorten((e && e.message) || 'erro', 140), true);
    }
  }

  async function fvsSetStatus(itemId, st){

    if(it.task_id && st !== 'reprovado' && st !== 'refeito'){ toast('Essa reprovação já está no ClickUp. Só dá para marcar como refeito.', true); return; }
    if(st === 'reprovado' || st === 'refeito'){ state.fsheet = { itemId:itemId, status:st, draft:null }; render(); return; }
    var novo = it.status === st ? null : st;
    var patch = { status:novo, problema:null, acao:null, liberado_por:null, foto_path:null, foto_ok:false };
    try{
      await updateFvsItem(it.id, patch);
      Object.assign(it, patch); it._fotoUrl = '';

      render();
    }catch(e){ toast('Não foi possível salvar: ' + shorten((e && e.message) || 'erro', 120), true); }

  async function saveFvsSheet(){
    var f = curF(), s = state.fsheet; if(!f || !s) return;
    var it = fItem(f, s.itemId); if(!it) return;
    var lock = !!it.task_id;
    var prob = lock ? it.problema : $('fProb').value.trim();
    if(!prob){ toast('Descreva o problema encontrado.', true); $('fProb').focus(); return; }
    var acao = null, lib = null;
    if(s.status === 'refeito'){
      acao = $('fAcao').value.trim(); lib = $('fLib').value.trim();
      if(!acao){ toast('Descreva a ação executada.', true); $('fAcao').focus(); return; }
      if(!lib){ toast('Informe quem liberou.', true); $('fLib').focus(); return; }
    }
    var btn = $('fSave'); btn.disabled = true;
    try{
      var fotoPath = it.foto_path, fotoOk = it.foto_ok;
      if(!lock && s.draft && s.draft.blob){
        busy('Guardando a foto...');
        fotoPath = await uploadFile(s.draft.blob, 'fotos'); fotoOk = false;
      }
      var patch = { status:s.status, problema:prob, acao:acao, liberado_por:lib, foto_path:fotoPath, foto_ok:fotoOk };
      await updateFvsItem(it.id, patch);
      Object.assign(it, patch);
      if(fotoPath) it._fotoUrl = await resolveUrl(fotoPath);
      await syncFvsStatus(f);
      busy(null); state.fsheet = null; render();
      toast(s.status === 'reprovado' ? 'Item reprovado.' : 'Item refeito e aprovado.');
    }catch(e){ busy(null); btn.disabled = false; toast('Não foi possível salvar: ' + shorten((e && e.message) || 'erro', 140), true); }
  }
  async function sendFvs(){
    var f = curF(); if(!f) return;
    var list = f.itens.filter(fvsPendEnvio);
    if(!list.length){ toast('Nada pendente para enviar.'); return; }
    var onde = f.predio + ' / ' + f.unidade + (f.local ? ' / ' + f.local : '');
    var okCount = 0, failCount = 0, stop = false, warn = '';
    for(var i = 0; i < list.length && !stop; i++){
      var it = list[i];
      busy('Enviando item ' + it.n + ' (' + (i+1) + ' de ' + list.length + ')...');
      it.erro = null;
      try{
        if(!it.task_id){
          var desc = '**FVS ' + f.modelo_codigo + ' - ' + f.modelo_nome + '**\n' +
            '**Local:** ' + onde + '\n' +
            '**Data da inspeção:** ' + fmtDia(f.data_inspecao) + '\n' +
            '**Inspecionado por:** ' + (f.inspetor || 'Não informado') + '\n' +
            '**Item ' + it.n + ' (reprovado):** ' + it.texto + '\n\n' +
            '**Problema encontrado:**\n' + it.problema;
          var res = await cu('list/' + f.list_id + '/task', { method:'POST', json:{
            name: 'FVS ' + f.modelo_codigo + ' - ' + (f.local || f.unidade || 'Sem local') + ': ' + shorten(it.problema, 70),
            markdown_description: desc,
            priority: 3
          }});
          if(!res || !res.id) throw { code:'http', message:'O ClickUp não devolveu o ID da task.' };
          it.task_id = res.id; it.task_url = res.url || ('https://app.clickup.com/t/' + res.id);
          await updateFvsItem(it.id, { task_id:it.task_id, task_url:it.task_url });
        }
      }catch(e){
        failCount++; it.erro = e.message || 'Falha ao criar a task.';
        if(ambiguous(e)) warn = 'Uma task pode ter sido criada mesmo com o erro. Confira no ClickUp antes de tentar de novo.';
        if(e.code === 'auth'){ busy(null); try{ await updateFvsItem(it.id, { erro:it.erro }); }catch(x){} clickUpLogout(e.message); return; }
        if(stopErr(e)) stop = true;
        try{ await updateFvsItem(it.id, { erro:it.erro }); }catch(x){}
        continue;
      }
      try{
        if(it.foto_path && !it.foto_ok){
          var fr = await fetch(it._fotoUrl); var fb = await fr.blob();
          var fd = new FormData(); fd.append('attachment', fb, 'fvs-' + f.modelo_codigo + '-item-' + it.n + '-foto.jpg');
          await cu('task/' + it.task_id + '/attachment', { method:'POST', form: fd });
          it.foto_ok = true; await updateFvsItem(it.id, { foto_ok:true });
        }
        okCount++;
      }catch(e){
        failCount++; it.erro = 'Task criada, mas o anexo falhou: ' + (e.message || 'erro');
        if(ambiguous(e)) warn = 'Um anexo pode ter subido mesmo com o erro. Confira a task antes de reenviar.';
        if(e.code === 'auth'){ busy(null); try{ await updateFvsItem(it.id, { erro:it.erro }); }catch(x){} clickUpLogout(e.message); return; }
        if(stopErr(e)) stop = true;
        try{ await updateFvsItem(it.id, { erro:it.erro }); }catch(x){}
      }
    }
    busy(null);
    if(failCount === 0) toast(okCount + (okCount === 1 ? ' reprovação enviada ao ClickUp.' : ' reprovações enviadas ao ClickUp.'));
    else toast(okCount + ' enviadas, ' + failCount + ' com problema. ' + warn, true);
    render();
  }

    nomes.sort(function(a,b){ return a.localeCompare(b, 'pt-BR', { numeric:true }); });
    if(ativa && !(ativa in contagem)) ativa = '';
    var html = '';
    if(nomes.length > 1){
      html = '<div class="tabs no-print">' + [''].concat(nomes).map(function(n){
        return '<button class="tab' + (n === ativa ? ' on' : '') + '" data-act="' + act + '" data-id="' + esc(n) + '">' + (n ? esc(n) + '<small>' + contagem[n] + '</small>' : 'Todos<small>' + rows.length + '</small>') + '</button>';

    }
    var lista = ativa ? rows.filter(function(v){ return (v.predio || 'Sem empreendimento') === ativa; }) : rows;
    return { html:html, lista:lista, ativa:ativa };
  }

  function hierState(what){
    if(!state.token) return { ok:false, html:'<div class="empty"><p>Para criar ' + what + ', conecte sua conta do ClickUp — é de lá que vêm os prédios e as unidades.</p><button class="btn" data-act="conectar-clickup">Conectar ClickUp</button></div>' };
    if(state.hierLoading) return { ok:false, html:'<div class="empty"><p>Buscando as unidades no ClickUp...</p></div>' };
    if(state.hierError) return { ok:false, html:'<div class="notice err">' + esc(state.hierError) + '</div><button class="btn secondary" data-act="reload-h">Tentar de novo</button>' };
    if(!state.folders) return { ok:false, html:'' };
    var n = state.novo, h = '';
    var folder = state.folders.filter(function(f){ return f.id === n.folderId; })[0];
    if(state.teams.length > 1){
      h += '<label class="lbl">Workspace</label><select id="nTeam">' + state.teams.map(function(t){ return '<option value="' + esc(t.id) + '"' + (String(t.id) === String(state.teamId) ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select>';
    }
    if(state.spaces.length > 1){
      h += '<label class="lbl">Espaço</label><select id="nSpace">' + state.spaces.map(function(s){ return '<option value="' + esc(s.id) + '"' + (String(s.id) === String(state.spaceId) ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select>';
    }
    h += '<label class="lbl">Prédio (pasta no ClickUp)</label><select id="nFolder"><option value="">Selecione</option>' +
      state.folders.map(function(f){ return '<option value="' + esc(f.id) + '"' + (f.id === n.folderId ? ' selected' : '') + '>' + esc(f.name) + '</option>'; }).join('') + '</select>';
    h += '<label class="lbl">Unidade (lista no ClickUp)</label><select id="nList"' + (folder ? '' : ' disabled') + '><option value="">Selecione</option>' +
      (folder ? folder.lists.map(function(l){ return '<option value="' + esc(l.id) + '"' + (l.id === n.listId ? ' selected' : '') + '>' + esc(l.name) + '</option>'; }).join('') : '') + '</select>';
    return { ok:true, html:h };

  // ---- telas de FVS ----
  function fvsCounts(f){
    var c = { total:f.itens.length, resp:0, rep:0 };
    f.itens.forEach(function(i){ if(i.status) c.resp++; if(i.status === 'reprovado') c.rep++; });
    return c;
  }
  function fvsChip(f){
    var c = fvsCounts(f);
    if(f.status === 'finalizada') return '<span class="chip green">Conforme</span>';
    if(c.rep) return '<span class="chip orange">' + c.rep + (c.rep === 1 ? ' reprovado' : ' reprovados') + '</span>';
    return c.resp ? '<span class="chip amber">Em andamento</span>' : '<span class="chip">Nova</span>';
  }

    var h = userBar() + '<button class="link back" data-act="fvs-modelos">Voltar</button>' +
      '<div class="top"><div><h1>' + (m && m.id ? 'Editar modelo' : 'Novo modelo') + '</h1><div class="sub">Um item de verificação por linha</div></div></div>';
    if(!m || !isAdmin()) return h + '<div class="empty"><p>Modelo não encontrado.</p></div>';
    h += '<label class="lbl" for="mCod">Código</label><input id="mCod" value="' + esc(m.codigo) + '" maxlength="20" placeholder="Ex: 012">';
    h += '<label class="lbl" for="mNome">Nome do serviço</label><input id="mNome" value="' + esc(m.nome) + '" maxlength="200" placeholder="Ex: Execução de contrapiso">';
    h += '<label class="lbl" for="mItens">Itens de verificação</label><textarea id="mItens" style="min-height:280px" placeholder="Utilização de EPIs e EPCs&#10;Limpeza do local">' + esc(m.itensTxt) + '</textarea>';
    h += '<label class="lbl" for="mAtivo">Situação</label><select id="mAtivo"><option value="1"' + (m.ativo ? ' selected' : '') + '>Ativo (aparece ao criar uma FVS)</option><option value="0"' + (m.ativo ? '' : ' selected') + '>Inativo</option></select>';
    h += '<div class="sub" style="margin-top:10px">Mudar o modelo não altera as FVS que já foram criadas.</div>';
    h += '<div style="margin-top:20px;display:flex;gap:10px"><button class="btn" id="mSave" data-act="fmodelo-salvar">Salvar</button><button class="btn secondary" data-act="fvs-modelos">Cancelar</button></div>';
    return h;
  }

  function sheetHtml(){
    var s = state.sheet; if(!s) return '';
    var v = cur(), d = s.defId ? v.defeitos.filter(function(q){ return q.id === s.defId; })[0] : null;
    var ro = s.mode === 'ver';
    var title = s.mode === 'novo' ? 'Novo defeito' : (ro ? 'Ponto ' + d.n : 'Editar ponto ' + d.n);
    var fotoSrc = s.draft ? s.draft.url : (d && d._fotoUrl ? d._fotoUrl : '');
    var h = '<div class="sheet" role="dialog" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2>';
    if(ro) h += '<div class="sub">Este ponto já está no ClickUp e não pode mais ser alterado por aqui.</div>';
    h += '<label class="lbl" for="sAmb">Ambiente</label><input id="sAmb" list="ambList" value="' + esc(d ? d.ambiente : '') + '"' + (ro ? ' disabled' : '') + ' placeholder="Ex: Banheiro da suíte">' +
      '<datalist id="ambList">' + AMBIENTES.map(function(a){ return '<option value="' + esc(a) + '">'; }).join('') + '</datalist>';
    h += '<label class="lbl" for="sDesc">Descrição do defeito</label><textarea id="sDesc"' + (ro ? ' disabled' : '') + ' placeholder="O que está errado e onde">' + esc(d ? d.descricao : '') + '</textarea>';
    h += '<label class="lbl" for="sPrio">Prioridade</label><select id="sPrio"' + (ro ? ' disabled' : '') + '>' + ['Alta','Média','Baixa'].map(function(p){
      var sel = d ? d.prioridade === p : p === 'Média'; return '<option' + (sel ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select>';
    h += '<label class="lbl">Foto</label><div class="foto"><img id="fotoPrev" alt="Foto do defeito"' + (fotoSrc ? ' src="' + esc(fotoSrc) + '"' : ' hidden') + '>' +
      (ro ? '' : '<input type="file" id="sFoto" accept="image/*"><div class="sub" style="margin-top:5px">No celular, abre a câmera ou a galeria.</div>') + '</div>';
    h += '<div class="btns">';
    if(s.mode === 'editar') h += s.confirmDel ? '<button class="link danger" data-act="del-ok">Confirmar exclusão</button>' : '<button class="link danger" data-act="del">Excluir ponto</button>';
    h += '<span class="spacer"></span><button class="btn secondary" data-act="fechar">' + (ro ? 'Fechar' : 'Cancelar') + '</button>' +
      (ro ? '' : '<button class="btn" id="sSave" data-act="salvar">Salvar</button>') + '</div></div>';
    return h;
  }

  function render(){
    var root = $('root'), ov = $('overlay');
    var ps = $('planScroll'), sl = ps ? ps.scrollLeft : 0, st = ps ? ps.scrollTop : 0;
    var h;
    if(!state.authChecked) h = '<div class="empty"><p>Carregando...</p></div>';
    else if(!state.session) h = viewSupaLogin();
    else if(!state.perfilChecked) h = '<div class="empty"><p>Carregando...</p></div>';
    else if(!isAprovado()) h = viewAguardando();
    else if(state.view === 'acessos') h = viewAcessos();
    else if(state.view === 'menu') h = viewMenu();
    else if(state.view === 'fvs') h = viewFvs();
    else if(state.view === 'fvs-novo') h = viewFvsNovo();
    else if(state.view === 'fvs-insp') h = viewFvsInsp();
    else if(state.view === 'fvs-rel') h = viewFvsRel();
    else if(state.view === 'fvs-modelos') h = viewFvsModelos();
    else if(state.view === 'fvs-modelo') h = viewFvsModelo();
    else if(state.view === 'novo') h = viewNovo();
    else if(state.view === 'vistoria') h = viewVistoria();
    else if(state.view === 'relatorio') h = viewRelatorio();
    else h = viewHome();
    root.innerHTML = h;
    if(state.session && state.view === 'vistoria'){ var p2 = $('planScroll'); if(p2){ p2.scrollLeft = sl; p2.scrollTop = st; } }
    if(state.session && isAprovado() && state.sheet && state.view === 'vistoria'){ ov.innerHTML = sheetHtml(); ov.hidden = false; }
    else if(state.session && isAprovado() && state.fsheet && state.view === 'fvs-insp'){ ov.innerHTML = fvsSheetHtml(); ov.hidden = false; }
    else { ov.innerHTML = ''; ov.hidden = true; }
    wireForms();
  }

  function wireForms(){
    var ae = $('authEmail');
    if(ae) ae.addEventListener('keydown', function(e){ if(e.key === 'Enter') sendMagicLink(); });
    var an = $('authNome');
    if(an) an.addEventListener('keydown', function(e){ if(e.key === 'Enter') sendMagicLink(); });
    var t = $('nTeam');
    if(t) t.addEventListener('change', async function(){
      state.teamId = t.value; lsSet('vst_team', t.value); state.hierLoading = true; render();
      try{ await loadSpaces(); state.hierError = null; }catch(e){ if(e.code === 'auth'){ clickUpLogout(e.message); state.hierLoading=false; render(); return; } state.hierError = e.message || 'Falha ao carregar.'; }
      state.hierLoading = false; render();
    });
    var sp = $('nSpace');
    if(sp) sp.addEventListener('change', async function(){
      state.spaceId = sp.value; lsSet('vst_space', sp.value); state.hierLoading = true; render();
      try{ await loadFolders(); state.hierError = null; }catch(e){ if(e.code === 'auth'){ clickUpLogout(e.message); state.hierLoading=false; render(); return; } state.hierError = e.message || 'Falha ao carregar.'; }
      state.hierLoading = false; render();
    });
    var f = $('nFolder');
    if(f) f.addEventListener('change', function(){ state.novo.folderId = f.value; state.novo.listId = ''; render(); });
    var l = $('nList');
    if(l) l.addEventListener('change', function(){ state.novo.listId = l.value; });
    var nf = $('nFile');
    if(nf) nf.addEventListener('change', function(){ state.novo.file = nf.files && nf.files[0] || null; render(); });
    var fm = $('fModelo');
    if(fm) fm.addEventListener('change', function(){ state.fnovo.modeloId = fm.value; });
    var fl = $('fLocal');
    if(fl) fl.addEventListener('input', function(){ state.fnovo.local = fl.value; });
    var fi = $('fInsp');
    if(fi) fi.addEventListener('input', function(){ state.fnovo.inspetor = fi.value; });
    var fd = $('fData');
    if(fd) fd.addEventListener('change', function(){ state.fnovo.data = fd.value; });
    var fo = $('fObs');
    if(fo) fo.addEventListener('change', async function(){
      var f = curF(); if(!f) return;
      var val = fo.value.trim() || null;
      try{ await updateFvsInsp(f.id, { observacoes: val }); f.observacoes = val; }
      catch(e){ toast('Não foi possível salvar as observações: ' + shorten((e && e.message) || 'erro', 120), true); }
    });
    var ff = $('fFoto');
    if(ff) ff.addEventListener('change', async function(){
      var file = ff.files && ff.files[0]; if(!file || !state.fsheet) return;
      try{
        busy('Preparando a foto...');
        var blob = await compressImage(file, 1600, 700 * 1024);
        state.fsheet.draft = { blob: blob, url: URL.createObjectURL(blob) };
        var prev = $('fFotoPrev'); if(prev){ prev.src = state.fsheet.draft.url; prev.hidden = false; }
        busy(null);
      }catch(e){ busy(null); toast('Não consegui usar essa foto.', true); }
    });
    [['mCod', 'codigo'], ['mNome', 'nome'], ['mItens', 'itensTxt']].forEach(function(pair){
      var el = $(pair[0]);
      if(el) el.addEventListener('input', function(){ if(state.fm) state.fm[pair[1]] = el.value; });
    });
    var ma = $('mAtivo');
    if(ma) ma.addEventListener('change', function(){ if(state.fm) state.fm.ativo = ma.value === '1'; });
    var sf = $('sFoto');
    if(sf) sf.addEventListener('change', async function(){
      var file = sf.files && sf.files[0]; if(!file || !state.sheet) return;
      try{
        busy('Preparando a foto...');
        var blob = await compressImage(file, 1600, 700 * 1024);
        state.sheet.draft = { blob: blob, url: URL.createObjectURL(blob) };
        var prev = $('fotoPrev'); if(prev){ prev.src = state.sheet.draft.url; prev.hidden = false; }
        busy(null);
      }catch(e){ busy(null); toast('Não consegui usar essa foto.', true); }
    });
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]'); if(!t) return;
    var a = t.dataset.act;
    if(a === 'enviar-link'){ sendMagicLink(); }
    else if(a === 'sair-supa'){ supabaseLogout(); }
    else if(a === 'checar-acesso'){ t.disabled = true; refreshAcesso(); }
    else if(a === 'acessos'){ state.view = 'acessos'; render(); loadPedidos(); }
    else if(a === 'aprovar'){ t.disabled = true; decidirAcesso(t.dataset.id, 'aprovado'); }
    else if(a === 'recusar'){ t.disabled = true; decidirAcesso(t.dataset.id, 'recusado'); }
    else if(a === 'conectar-clickup'){ location.href = API_BASE + '/auth/start'; }
    else if(a === 'sair-clickup'){ clickUpLogout(''); }
    else if(a === 'novo'){ state.view = 'novo'; state.novo = { folderId:folderIdDaAba(), listId:'', file:null }; if(state.token && !state.folders && !state.hierLoading) loadHierarchy(); else render(); }
    else if(a === 'aba'){ state.aba = t.dataset.id; lsSet('vst_aba', state.aba); render(); }
    else if(a === 'reload-h'){ loadHierarchy(); }
    else if(a === 'menu'){ state.view = 'menu'; state.currentId = null; state.fcurId = null; state.sheet = null; state.fsheet = null; state.confirmDelV = false; state.confirmDelF = false; render(); loadAll(); loadFvs(); }
    else if(a === 'fvs'){ state.view = 'fvs'; state.fcurId = null; state.fsheet = null; state.confirmDelF = false; render(); loadFvs(); }
    else if(a === 'aba-fvs'){ state.abaFvs = t.dataset.id; lsSet('vst_aba_fvs', state.abaFvs); render(); }
    else if(a === 'fvs-novo'){
      state.view = 'fvs-novo'; state.novo = { folderId:folderIdDaAba(), listId:'', file:null };
      state.fnovo = { modeloId:'', local:'', inspetor:nomeUsuario(), data:hoje() };
      if(state.token && !state.folders && !state.hierLoading) loadHierarchy(); else render();
    }
    else if(a === 'fvs-criar'){ createFvs(); }
    else if(a === 'fvs-abrir'){ state.fcurId = t.dataset.id; state.view = 'fvs-insp'; state.confirmDelF = false; render(); }
    else if(a === 'fst'){ fvsSetStatus(t.dataset.id, t.dataset.st); }
    else if(a === 'fedit'){
      if(e.target.closest('a')) return;
      var fe = curF(), fit = fe && fItem(fe, t.dataset.id);
      if(fit){ state.fsheet = { itemId:fit.id, status:fit.status, draft:null }; render(); }
    }
    else if(a === 'f-aprovar-resto'){ fvsApproveRest(); }
    else if(a === 'f-salvar'){ saveFvsSheet(); }
    else if(a === 'f-fechar'){ state.fsheet = null; render(); }
    else if(a === 'f-enviar'){ sendFvs(); }
    else if(a === 'f-rel'){ state.view = 'fvs-rel'; render(); }
    else if(a === 'f-voltar'){ state.view = 'fvs-insp'; render(); }
    else if(a === 'f-excluir'){ state.confirmDelF = true; render(); }
    else if(a === 'f-excluir-cancel'){ state.confirmDelF = false; render(); }
    else if(a === 'f-excluir-ok'){ deleteFvs(); }
    else if(a === 'fvs-modelos'){ state.view = 'fvs-modelos'; state.fm = null; render(); loadFvs(); }
    else if(a === 'fmodelo'){
      var mo = state.fvs.modelos.filter(function(x){ return x.id === t.dataset.id; })[0];
      state.fm = mo ? { id:mo.id, codigo:mo.codigo, nome:mo.nome, itensTxt:(mo.itens || []).join('\n'), ativo:!!mo.ativo } : { id:null, codigo:'', nome:'', itensTxt:'', ativo:true };
      state.view = 'fvs-modelo'; render();
    }
    else if(a === 'fmodelo-salvar'){ saveModelo(); }
    else if(a === 'home'){ state.view = 'home'; state.currentId = null; state.confirmDelV = false; render(); loadAll(); }
    else if(a === 'voltar-v'){ state.view = 'vistoria'; render(); }
    else if(a === 'abrir'){ state.currentId = t.dataset.id; state.view = 'vistoria'; state.zoom = 1; state.confirmDelV = false; render(); }
    else if(a === 'criar'){ createVistoria(); }
    else if(a === 'zoom+'){ state.zoom = Math.min(4, state.zoom + 0.5); render(); }
    else if(a === 'zoom-'){ state.zoom = Math.max(1, state.zoom - 0.5); render(); }
    else if(a === 'pin'){ e.stopPropagation(); openSheetDef(t.dataset.id); }
    else if(a === 'fechar'){ state.sheet = null; render(); }
    else if(a === 'salvar'){ saveSheet(); }
    else if(a === 'del'){ state.sheet.confirmDel = true; render(); }
    else if(a === 'del-ok'){ deleteDef(); }
    else if(a === 'enviar'){ sendAll(); }
    else if(a === 'relatorio'){ state.view = 'relatorio'; render(); }
    else if(a === 'imprimir'){ try{ window.print(); }catch(err){ toast('Não consegui abrir a impressão aqui. Use o menu do navegador para imprimir.', true); } }
    else if(a === 'excluir-v'){ state.confirmDelV = true; render(); }
    else if(a === 'excluir-v-cancel'){ state.confirmDelV = false; render(); }
    else if(a === 'excluir-v-ok'){ deleteVistoria(); }
  });
  $('overlay').addEventListener('click', function(e){ if(e.target.id === 'overlay'){ state.sheet = null; state.fsheet = null; render(); } });

  var down = null;
  document.addEventListener('pointerdown', function(e){
    if(e.target.closest('.pin')){ down = null; return; }
    if(!e.target.closest('#planWrap')){ down = null; return; }
    down = { x:e.clientX, y:e.clientY, t:Date.now() };
  });
  document.addEventListener('pointercancel', function(){ down = null; });
  document.addEventListener('pointerup', function(e){
    if(!down) return; var d0 = down; down = null;
    if(state.view !== 'vistoria' || state.sheet) return;
    if(Math.hypot(e.clientX - d0.x, e.clientY - d0.y) > 8 || Date.now() - d0.t > 600) return;
    var img = $('planImg'); if(!img) return;
    var r = img.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if(x < 0 || x > 1 || y < 0 || y > 1) return;
    openSheetNew(x, y);
  });

  readClickUpHash();
  state.token = lsGet('vst_token');
  render();

  if(!SUPA_OK){ state.authChecked = true; render(); }
  else{
    supabase.auth.onAuthStateChange(function(event, session){
      var had = !!state.session;
      state.session = session;
      state.authChecked = true;
      if(session && !had){
        state.authSent = false; state.authError = '';
        startSession();
      } else if(!session && had){
        endSession();
      }
      render();
    });
    supabase.auth.getSession().then(function(r){
      state.session = r.data.session; state.authChecked = true;
      if(state.session) startSession();
      render();
    });
  }
  if(state.token) fetchClickUpUser();
})();
</script>
</body>
</html>
