# Evita que o projeto Supabase (plano gratuito) seja pausado por inatividade.
# A cada 3 dias faz uma consulta leve ao banco usando a chave pública `anon`,
# lida do próprio index.html (então acompanha se a URL ou a chave mudarem).
# A consulta volta vazia por causa do RLS, mas ainda conta como atividade no banco.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o banco
        run: |
          URL=$(grep -oE "SUPABASE_URL = '[^']+'" index.html | head -1 | cut -d"'" -f2)
          KEY=$(grep -oE "SUPABASE_ANON_KEY = '[^']+'" index.html | head -1 | cut -d"'" -f2)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Não achei SUPABASE_URL ou SUPABASE_ANON_KEY no index.html"; exit 1; fi
          CODE=$(curl -s -m 30 -o /tmp/resp.txt -w '%{http_code}' "$URL/rest/v1/usuarios?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          cat /tmp/resp.txt
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then echo "O Supabase não respondeu como esperado (projeto pausado?)"; exit 1; fi
